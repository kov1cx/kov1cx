<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="description" content="404 – Trang không tồn tại / Page Not Found / Page non trouvée">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link href="css/base.css" rel="stylesheet">
  <link href="css/layout.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <title>404 – Trang không tồn tại · Page Not Found · Page non trouvée</title>
</head>
<body class="dp-error-page">
  <main class="dp-error dp-grid">
    <div class="dp-error__rail">
      <span class="dp-label">404 / ERROR</span>
    </div>
    <div class="dp-error__body">
      <h1 class="dp-error__code">404</h1>
      <div class="dp-error__messages">
        <p class="dp-error__lead"><strong>Trang không tồn tại hoặc đã được di chuyển.</strong></p>
        <p class="dp-error__text">The requested page could not be found or has been moved.</p>
        <p class="dp-error__text">La page demandée n’existe pas ou a été déplacée.</p>
      </div>
      <div class="dp-error__actions">
        <a href="index.html" class="dp-btn dp-btn--solid" onclick="localStorage.setItem('uiLang','vi')">01 Trang chủ (VI)</a>
        <a href="index.html" class="dp-btn" onclick="localStorage.setItem('uiLang','en')">02 Home (EN)</a>
        <a href="index.html" class="dp-btn" onclick="localStorage.setItem('uiLang','fr')">03 Accueil (FR)</a>
      </div>
    </div>
  </main>
  <script src="js/theme.js" defer></script>
</body>
</html>
