<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#FBF9F5; font-family:'IBM Plex Mono',monospace;">
  <defs>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E6E0D5" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F5"/>
  <rect width="100%" height="100%" fill="url(#grid2)"/>

  <!-- Coordinates & Axes -->
  <line x1="96" y1="448" x2="880" y2="448" stroke="#8C827A" stroke-width="1.5"/>
  <line x1="96" y1="68" x2="96" y2="448" stroke="#8C827A" stroke-width="1.5"/>

  <!-- Y-Axis labels (>= 12px) -->
  <g font-size="12" fill="#716860" text-anchor="end">
    <text x="80" y="452">0</text>
    <text x="80" y="356">100t</text>
    <text x="80" y="260">200t</text>
    <text x="80" y="164">300t</text>
    <text x="80" y="76">400t</text>
  </g>

  <!-- X-Axis weeks (>= 12px) -->
  <g font-size="12" fill="#716860" text-anchor="middle">
    <text x="160" y="476">W01</text>
    <text x="272" y="476">W10</text>
    <text x="384" y="476">W20</text>
    <text x="496" y="476">W30</text>
    <text x="608" y="476">W40</text>
    <text x="720" y="476">W50</text>
    <text x="832" y="476">W52</text>
  </g>

  <!-- Confidence interval band -->
  <path d="M 496 244 L 608 190 L 720 216 L 832 148 L 832 312 L 720 352 L 608 312 L 496 326 Z" fill="rgba(188,71,58,0.12)" stroke="none"/>

  <!-- Actual historical series -->
  <polyline points="160,380 224,338 272,298 336,326 384,258 448,284 496,244" fill="none" stroke="#2B2826" stroke-width="2.5"/>

  <!-- Forecast line (Terracotta) -->
  <polyline points="496,244 608,250 720,284 832,230" fill="none" stroke="#BC473A" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Data points -->
  <circle cx="160" cy="380" r="4.5" fill="#2B2826"/>
  <circle cx="272" cy="298" r="4.5" fill="#2B2826"/>
  <circle cx="384" cy="258" r="4.5" fill="#2B2826"/>
  <circle cx="496" cy="244" r="5.5" fill="#BC473A"/>
  <circle cx="608" cy="250" r="4.5" fill="#BC473A"/>
  <circle cx="720" cy="284" r="4.5" fill="#BC473A"/>
  <circle cx="832" cy="230" r="4.5" fill="#BC473A"/>
</svg>
